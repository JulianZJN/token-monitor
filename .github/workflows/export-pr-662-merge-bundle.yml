name: Resolve PR 662 against current main

on:
  push:
    branches:
      - ci/resolve-662-bundle

permissions:
  contents: write

jobs:
  resolve-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codex-web-cost-selection
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Merge the reviewed upstream head
        shell: bash
        run: |
          set -euo pipefail
          expected_head='6651af01460ade4977b995275b48efa75ed1d8d9'
          upstream_head='8ad5769cb0636a59df4e92b7797c955ada833594'
          test "$(git rev-parse HEAD)" = "$expected_head"
          git config user.name 'JulianZJN'
          git config user.email '148066842+JulianZJN@users.noreply.github.com'
          git remote add upstream https://github.com/Javis603/token-monitor.git
          git fetch upstream "$upstream_head"
          git branch upstream-main "$upstream_head"
          set +e
          git merge --no-commit --no-ff upstream-main
          merge_status=$?
          set -e
          test "$merge_status" -ne 0
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          printf '%s\n' "${conflicts[@]}"
          expected=(
            src/electron/main.js
            src/electron/renderer/index.html
            src/shared/hubBuildRegistry.json
            worker/src/shared/hubBuildRegistry.json
          )
          test "${conflicts[*]}" = "${expected[*]}"

      - name: Resolve feature composition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          conflict = re.compile(
              r"<<<<<<< HEAD\n(.*?)=======\n(.*?)>>>>>>> upstream-main\n",
              re.DOTALL,
          )

          p = Path("src/electron/main.js")
          text = p.read_text()
          matches = list(conflict.finditer(text))
          if len(matches) != 7:
              raise RuntimeError(f"expected 7 main.js conflicts, found {len(matches)}")
          replacements = [
              "  return projectModelAliasStats(projectUsageCosts(projectLimitStatsForDisplay(stats, {\n",
              "  }), settings?.usageCostRules), settings?.modelAliases, { grouping: settings?.modelAliasGrouping });\n",
              "    usageCostRules: normalizeUsageCostRules(settings?.usageCostRules),\n"
              "    modelAliases: Object.freeze(normalizeModelAliases(settings?.modelAliases)),\n"
              "    modelAliasGrouping: normalizeModelAliasGrouping(settings?.modelAliasGrouping),\n",
              "        history: projectModelAliasHistory(\n"
              "          projectHistoryCosts(history, work.usageCostRules),\n"
              "          work.modelAliases,\n"
              "          { grouping: work.modelAliasGrouping }\n"
              "        )\n",
              "  // Export remains lossless: local display preferences never rewrite exported IDs or costs.\n"
              "  const history = await getCompleteHistory().catch(() => null);\n",
              "      usageCostRules: normalizeUsageCostRules(patch.usageCostRules ?? settings.usageCostRules),\n",
              "    const usageCostRulesChanged = JSON.stringify(settings.usageCostRules)\n"
              "      !== JSON.stringify(previousSettingsState.usageCostRules);\n"
              "    const modelAliasesChanged = JSON.stringify(settings.modelAliases)\n"
              "      !== JSON.stringify(previousSettingsState.modelAliases)\n"
              "      || settings.modelAliasGrouping !== previousSettingsState.modelAliasGrouping;\n"
              "    if (usageCostRulesChanged || modelAliasesChanged) {\n"
              "      // No collection/pricing refresh: re-project the cached source immediately,\n"
              "      // including when the hub is offline. Revision decoration invalidates the\n"
              "      // main renderer's full-history caches; the dashboard has its own event.\n"
              "      refreshLimitStatsPresentation();\n"
              "      if (dashboardWindow && !dashboardWindow.isDestroyed()) {\n"
              "        try { dashboardWindow.webContents.send('dashboard:historyChanged'); } catch (_) {}\n"
              "      }\n",
          ]
          out = []
          cursor = 0
          for match, replacement in zip(matches, replacements):
              out.append(text[cursor:match.start()])
              out.append(replacement)
              cursor = match.end()
          out.append(text[cursor:])
          p.write_text("".join(out))

          p = Path("src/electron/renderer/index.html")
          text = p.read_text()
          matches = list(conflict.finditer(text))
          if len(matches) != 1:
              raise RuntimeError(f"expected 1 renderer conflict, found {len(matches)}")
          replacement = (
              '    <script src="../usageCostPolicy.js"></script>\n'
              '    <script src="modelAliases.js"></script>\n'
              '    <script src="modelAliasForm.js"></script>\n'
          )
          p.write_text(text[:matches[0].start()] + replacement + text[matches[0].end():])

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise RuntimeError(f"expected one anchor in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "tests/electron/usageCostIntegration.test.js",
              "const policy = require('../../src/electron/usageCostPolicy');\n",
              "const policy = require('../../src/electron/usageCostPolicy');\n"
              "const presentation = require('../../src/electron/modelAliasPresentation');\n",
          )
          replace_once(
              "tests/electron/usageCostIntegration.test.js",
              "return vm.runInNewContext(`(${body})`, { ...policy, ...dependencies });",
              "return vm.runInNewContext(`(${body})`, {\n"
              "    ...policy,\n"
              "    ...presentation,\n"
              "    syncProvenanceActive: () => false,\n"
              "    ...dependencies\n"
              "  });",
          )
          replace_once(
              "tests/electron/modelAliasIntegration.test.js",
              "const presentation = require('../../src/electron/modelAliasPresentation');\n",
              "const presentation = require('../../src/electron/modelAliasPresentation');\n"
              "const costPolicy = require('../../src/electron/usageCostPolicy');\n",
          )
          replace_once(
              "tests/electron/modelAliasIntegration.test.js",
              "return vm.runInNewContext(`(${body})`, { ...presentation, ...dependencies });",
              "return vm.runInNewContext(`(${body})`, { ...presentation, ...costPolicy, ...dependencies });",
          )
          PY
          git checkout --theirs src/shared/hubBuildRegistry.json worker/src/shared/hubBuildRegistry.json

      - name: Install, regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run update:hub-build
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          ! grep -RIn '^<<<<<<<\|^=======\|^>>>>>>>' \
            src/electron/main.js \
            src/electron/renderer/index.html \
            src/shared/hubBuildRegistry.json \
            worker/src/shared/hubBuildRegistry.json
          git diff upstream-main --check
          npm run verify

      - name: Commit and update the PR branch
        shell: bash
        run: |
          set -euo pipefail
          git commit -s -m 'merge: sync cost selection with current main'
          git push origin HEAD:feat/codex-web-cost-selection
          git push origin --delete ci/resolve-662-bundle || true
