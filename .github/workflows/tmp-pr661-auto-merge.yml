name: Temporary PR 661 automatic model merge verification

on:
  push:
    branches:
      - verify/pr661-auto-model-dedupe-20260912

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[debug]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply compatibility updates
        run: python scripts/tmp-pr661-auto-merge.py
      - run: npm ci
      - name: Verify
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run verify 2>&1 | tee verify.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Publish verification output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f verify.log
          git commit -m "test(models): capture verification output [debug]"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Fail on verification errors
        if: steps.verify.outputs.status != '0'
        run: exit 1
