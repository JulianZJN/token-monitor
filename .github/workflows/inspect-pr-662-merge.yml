name: Resolve PR 662 merge

on:
  push:
    branches:
      - automation/resolve-662

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Merge current upstream and verify
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Julian"
          git config user.email "148066842+JulianZJN@users.noreply.github.com"
          git remote add upstream https://github.com/Javis603/token-monitor.git
          git fetch upstream main
          git fetch origin feat/codex-web-cost-selection
          git checkout -B feat/codex-web-cost-selection origin/feat/codex-web-cost-selection

          if ! git merge --no-commit --no-ff upstream/main; then
            python <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/API.md')
          text = path.read_text()
          pattern = re.compile(r'<<<<<<< HEAD\n(.*?)=======\n(.*?)>>>>>>> upstream/main\n', re.S)
          resolved, count = pattern.subn(lambda m: m.group(1).rstrip() + '\n' + m.group(2).lstrip(), text)
          if count != 1:
              raise SystemExit(f'expected one docs/API.md conflict, found {count}')
          path.write_text(resolved)
          PY
            git add docs/API.md
            git checkout --theirs src/shared/hubBuildRegistry.json worker/src/shared/hubBuildRegistry.json
            git add src/shared/hubBuildRegistry.json worker/src/shared/hubBuildRegistry.json
          fi

          unresolved="$(git diff --name-only --diff-filter=U)"
          test -z "$unresolved" || { printf 'unresolved conflicts:\n%s\n' "$unresolved"; exit 1; }

          npm ci
          npm run update:hub-build
          npm run verify

          git add -A
          git commit -m "merge: sync cost selection with current main"
          git push origin HEAD:feat/codex-web-cost-selection
